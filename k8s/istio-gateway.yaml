apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: casa-verde-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: casa-verde-frontend
spec:
  hosts:
    - "*"
  gateways:
    - casa-verde-gateway
  http:
    - route:
        - destination:
            host: frontend-service
            port:
              number: 5173