services:

  backend:
    build: ./backend
    container_name: casa-verde-backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: casa-verde-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend